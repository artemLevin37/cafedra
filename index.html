<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кафедра борьбы</title>
<meta name="description" content="Кафедра борьбы — YouTube, TikTok и Telegram">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #000; --fg: #fff; --muted: #7a7a7a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  html { background: var(--bg); }
  /* Фон: круги борцовского ковра вокруг логотипа и тонкая сетка */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      repeating-radial-gradient(circle at 50% 50%, transparent 0 89px, rgba(255,255,255,.07) 90px 91px),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 32px 32px,
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 32px 32px;
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0%, rgba(0,0,0,.4) 45%, transparent 75%);
    mask-image: radial-gradient(circle at 50% 50%, #000 0%, rgba(0,0,0,.4) 45%, transparent 75%);
  }
  a.btn:not(.main) { background: rgba(0,0,0,.55); }
  body {
    color: var(--fg);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 48px 16px; -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 380px; text-align: center; animation: in .6s ease both; }
  @keyframes in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .mark {
    width: 72px; height: 72px; margin: 0 auto 24px; border: 2px solid var(--fg); border-radius: 50%;
    display: grid; place-items: center; font-weight: 800; font-size: 26px; letter-spacing: -.04em;
  }
  h1 { font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; text-transform: uppercase; }
  .tag { color: var(--muted); margin: 12px 0 40px; font-size: 15px; }
  nav { display: flex; flex-direction: column; gap: 12px; }
  a.btn {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 18px 20px; border: 1.5px solid var(--fg); border-radius: 999px;
    color: var(--fg); text-decoration: none; font-weight: 600; font-size: 17px;
    transition: background .2s, color .2s, transform .2s;
  }
  a.btn svg { width: 22px; height: 22px; fill: currentColor; flex: none; }
  a.btn:hover, a.btn:focus-visible { background: var(--fg); color: var(--bg); outline: none; }
  a.btn:active { transform: scale(.98); }
  a.btn.main { background: var(--fg); color: var(--bg); }
  a.btn.main:hover { background: transparent; color: var(--fg); }
  footer { margin-top: 48px; color: var(--muted); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">КБ</div>
    <h1>Кафедра<br>борьбы</h1>
    <p class="tag">Борьба. Техника. Сообщество.</p>

    <nav>
      <a class="btn main" href="https://t.me/wrestling11111111111_bot" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 3.2 2.9 10.4c-1.3.5-1.3 1.2-.2 1.6l4.8 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8L23 4.6c.3-1.3-.5-1.9-1.4-1.4ZM9.3 13.1l9.6-6c.5-.3.9-.1.5.2l-8.2 7.4-.3 3.4-1.6-5Z"/></svg>
        Телеграм-клуб
      </a>
      <a class="btn" href="https://www.youtube.com/@cafedra_wrestling" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2C.5 9.1.5 12 .5 12s0 2.9.5 4.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-4.8.5-4.8s0-2.9-.5-4.8ZM9.7 15.3V8.7l5.8 3.3-5.8 3.3Z"/></svg>
        YouTube
      </a>
      <a class="btn" href="https://www.tiktok.com/@cafedra_wrestling" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.6 2h-3.4v13.4a2.9 2.9 0 1 1-2.9-2.9c.3 0 .6 0 .9.1V9.1a6.3 6.3 0 1 0 5.4 6.3V8.6a8 8 0 0 0 4.7 1.5V6.7a4.7 4.7 0 0 1-4.7-4.7Z"/></svg>
        TikTok
      </a>
    </nav>

    <footer>© Кафедра борьбы</footer>
  </div>
</body>
</html>
